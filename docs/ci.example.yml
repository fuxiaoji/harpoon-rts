name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace
      - name: core tests
        run: cargo test -p harpoon-core
      - name: full-mechanics smoke (determinism + coverage gates)
        run: cargo run --release -p harpoon-server --example crimson_tide

  web-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check web/app.js
        run: node --check web/app.js
        continue-on-error: true # until web/ lands
