[project]
name = "harpoon-engine"
version = "0.1.0"
description = "Deterministic, source-traceable Harpoon V research engine"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["hypothesis>=6.120", "mypy>=1.14", "pytest>=8.3", "ruff>=0.9"]

[project.scripts]
harpoon = "harpoon.cli:main"
harpoon-ui = "harpoon.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harpoon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["harpoon"]
