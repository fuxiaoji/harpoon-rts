[workspace]
resolver = "2"
members = [
    "crates/harpoon-core",
    "crates/harpoon-server",
    "crates/harpoon-mcp",
    "crates/harpoon-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"

[profile.release]
opt-level = 3
lto = "thin"
debug = false

[profile.bench]
debug = true
